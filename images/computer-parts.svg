<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="Detailed diagram of an open desktop computer case showing the motherboard, CPU with cooler, RAM sticks, graphics card, storage drives, power supply, and case fan labeled">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081527"/>
      <stop offset="1" stop-color="#0d2240"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294a"/>
      <stop offset="1" stop-color="#0d1a30"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123056"/>
      <stop offset="1" stop-color="#0c2140"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4d6b"/>
      <stop offset="1" stop-color="#1d2b42"/>
    </linearGradient>
    <linearGradient id="ram" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#16223a"/>
    </linearGradient>
    <linearGradient id="psu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b23b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="cooler" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b4a7a"/>
      <stop offset="1" stop-color="#132844"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>

  <!-- subtle background grid -->
  <g stroke="#16304f" stroke-width="1" opacity="0.5">
    <path d="M0 60H1000M0 160H1000M0 260H1000M0 360H1000M0 460H1000M0 560H1000"/>
    <path d="M100 0V620M200 0V620M300 0V620M400 0V620M500 0V620M600 0V620M700 0V620M800 0V620M900 0V620"/>
  </g>

  <!-- ================= TOWER CASE ================= -->
  <!-- back panel of the case -->
  <rect x="250" y="40" width="330" height="540" rx="12" fill="url(#case)" stroke="#2563eb" stroke-width="3"/>
  <!-- inner shadow -->
  <rect x="258" y="48" width="314" height="524" rx="8" fill="#0a1830" opacity="0.6"/>

  <!-- ================= MOTHERBOARD ================= -->
  <rect x="272" y="62" width="286" height="500" rx="6" fill="url(#pcb)" stroke="#1e3a63" stroke-width="2"/>

  <!-- PCB copper traces -->
  <g stroke="#1c4a80" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M286 80h60v40h40"/>
    <path d="M286 92h48v94h30"/>
    <path d="M470 82v120h-30"/>
    <path d="M540 100v180h-40v60"/>
    <path d="M286 250h40v90h40"/>
    <path d="M300 420h-14v60"/>
    <path d="M540 320v80h-30v60"/>
    <path d="M420 380v40h-60"/>
  </g>

  <!-- Mounting holes -->
  <g fill="#0a1526" stroke="#33507a" stroke-width="1.5">
    <circle cx="288" cy="80" r="5"/>
    <circle cx="542" cy="80" r="5"/>
    <circle cx="288" cy="544" r="5"/>
    <circle cx="542" cy="544" r="5"/>
  </g>

  <!-- CPU + COOLER -->
  <!-- CPU socket / chip -->
  <rect x="300" y="104" width="76" height="76" rx="4" fill="#0d1d33" stroke="#4da3ff" stroke-width="2"/>
  <rect x="316" y="120" width="44" height="44" rx="3" fill="#1d4f8f"/>
  <g stroke="#6fc3ff" stroke-width="1" opacity="0.9">
    <path d="M320 124h36M320 130h36M320 136h36M320 142h36M320 148h36M320 154h36"/>
    <path d="M322 120v44M328 120v44M334 120v44M340 120v44M346 120v44M352 120v44"/>
  </g>
  <!-- cooler fan -->
  <circle cx="338" cy="142" r="60" fill="url(#cooler)" stroke="#4da3ff" stroke-width="2" opacity="0.95"/>
  <circle cx="338" cy="142" r="48" fill="none" stroke="#274c7c" stroke-width="1.5"/>
  <g fill="#5b8ec4" opacity="0.85">
    <ellipse cx="338" cy="110" rx="12" ry="30"/>
    <ellipse cx="338" cy="174" rx="12" ry="30"/>
    <ellipse cx="306" cy="142" rx="30" ry="12"/>
    <ellipse cx="370" cy="142" rx="30" ry="12"/>
    <ellipse cx="315" cy="119" rx="12" ry="30" transform="rotate(45 315 119)"/>
    <ellipse cx="361" cy="119" rx="12" ry="30" transform="rotate(-45 361 119)"/>
    <ellipse cx="315" cy="165" rx="12" ry="30" transform="rotate(-45 315 165)"/>
    <ellipse cx="361" cy="165" rx="12" ry="30" transform="rotate(45 361 165)"/>
  </g>
  <circle cx="338" cy="142" r="14" fill="#4da3ff" stroke="#9fd1ff" stroke-width="2"/>

  <!-- RAM (4 slots, 2 sticks) -->
  <g>
    <rect x="406" y="96" width="18" height="130" rx="2" fill="#0b1a2e" stroke="#2c4d7d" stroke-width="1.5"/>
    <rect x="430" y="96" width="18" height="130" rx="2" fill="#0b1a2e" stroke="#2c4d7d" stroke-width="1.5"/>
    <rect x="454" y="96" width="18" height="130" rx="2" fill="#0b1a2e" stroke="#2c4d7d" stroke-width="1.5"/>
    <rect x="478" y="96" width="18" height="130" rx="2" fill="#0b1a2e" stroke="#2c4d7d" stroke-width="1.5"/>

    <!-- installed stick 1 -->
    <rect x="430" y="92" width="18" height="134" rx="3" fill="url(#ram)" stroke="#8cc4ff" stroke-width="1.5"/>
    <g fill="#0b2f5c">
      <rect x="433" y="102" width="12" height="8"/>
      <rect x="433" y="116" width="12" height="8"/>
      <rect x="433" y="130" width="12" height="8"/>
      <rect x="433" y="144" width="12" height="8"/>
    </g>
    <g fill="#d9b45a">
      <rect x="432" y="212" width="4" height="4"/>
      <rect x="438" y="212" width="4" height="4"/>
      <rect x="444" y="212" width="4" height="4"/>
    </g>

    <!-- installed stick 2 -->
    <rect x="478" y="92" width="18" height="134" rx="3" fill="url(#ram)" stroke="#8cc4ff" stroke-width="1.5"/>
    <g fill="#0b2f5c">
      <rect x="481" y="102" width="12" height="8"/>
      <rect x="481" y="116" width="12" height="8"/>
      <rect x="481" y="130" width="12" height="8"/>
      <rect x="481" y="144" width="12" height="8"/>
    </g>
    <g fill="#d9b45a">
      <rect x="480" y="212" width="4" height="4"/>
      <rect x="486" y="212" width="4" height="4"/>
      <rect x="492" y="212" width="4" height="4"/>
    </g>
  </g>

  <!-- CHIPSET HEATSINK -->
  <rect x="300" y="210" width="72" height="72" rx="4" fill="url(#metal)" stroke="#476a99" stroke-width="1.5"/>
  <g stroke="#5c80ad" stroke-width="1.5" opacity="0.9">
    <path d="M306 219h60M306 230h60M306 241h60M306 252h60M306 263h60M306 274h60"/>
  </g>
  <text x="336" y="250" text-anchor="middle" font-family="Arial" font-size="9" fill="#a9c4e6">CHIPSET</text>

  <!-- GRAPHICS CARD (GPU) -->
  <g>
    <rect x="290" y="316" width="248" height="86" rx="6" fill="url(#gpu)" stroke="#3d5a80" stroke-width="2"/>
    <!-- PCIe gold connector -->
    <rect x="300" y="400" width="120" height="8" rx="1" fill="#d9b45a"/>
    <g fill="#8a6d2c">
      <rect x="306" y="400" width="4" height="8"/>
      <rect x="316" y="400" width="4" height="8"/>
      <rect x="326" y="400" width="4" height="8"/>
      <rect x="336" y="400" width="4" height="8"/>
      <rect x="346" y="400" width="4" height="8"/>
      <rect x="356" y="400" width="4" height="8"/>
      <rect x="366" y="400" width="4" height="8"/>
      <rect x="376" y="400" width="4" height="8"/>
      <rect x="386" y="400" width="4" height="8"/>
      <rect x="396" y="400" width="4" height="8"/>
      <rect x="406" y="400" width="4" height="8"/>
    </g>
    <!-- GPU fans -->
    <g>
      <circle cx="340" cy="359" r="30" fill="#0c1830" stroke="#4da3ff" stroke-width="1.5"/>
      <g fill="#4f7fb5" opacity="0.85">
        <ellipse cx="340" cy="341" rx="6" ry="15"/>
        <ellipse cx="340" cy="377" rx="6" ry="15"/>
        <ellipse cx="322" cy="359" rx="15" ry="6"/>
        <ellipse cx="358" cy="359" rx="15" ry="6"/>
      </g>
      <circle cx="340" cy="359" r="6" fill="#9fd1ff"/>
    </g>
    <g>
      <circle cx="420" cy="359" r="30" fill="#0c1830" stroke="#4da3ff" stroke-width="1.5"/>
      <g fill="#4f7fb5" opacity="0.85">
        <ellipse cx="420" cy="341" rx="6" ry="15"/>
        <ellipse cx="420" cy="377" rx="6" ry="15"/>
        <ellipse cx="402" cy="359" rx="15" ry="6"/>
        <ellipse cx="438" cy="359" rx="15" ry="6"/>
      </g>
      <circle cx="420" cy="359" r="6" fill="#9fd1ff"/>
    </g>
    <!-- GPU bracket / IO -->
    <rect x="520" y="320" width="10" height="72" rx="2" fill="#476a99"/>
    <g stroke="#0c1830" stroke-width="2">
      <path d="M521 330h8M521 342h8M521 354h8M521 366h8"/>
    </g>
  </g>

  <!-- STORAGE DRIVES -->
  <!-- drive cage -->
  <rect x="290" y="428" width="248" height="88" rx="5" fill="#0b1a2e" stroke="#2c4d7d" stroke-width="2"/>
  <!-- SSD (top) -->
  <rect x="300" y="436" width="110" height="34" rx="3" fill="#2b3a55" stroke="#5c80ad" stroke-width="1.5"/>
  <text x="355" y="457" text-anchor="middle" font-family="Arial" font-size="10" fill="#a9c4e6">SSD</text>
  <rect x="412" y="436" width="116" height="34" rx="3" fill="#1d2b42" stroke="#5c80ad" stroke-width="1.5"/>
  <text x="470" y="457" text-anchor="middle" font-family="Arial" font-size="10" fill="#8aa6c8">HDD</text>
  <!-- HDD (bottom) with platter hint -->
  <rect x="300" y="474" width="110" height="34" rx="3" fill="#243149" stroke="#5c80ad" stroke-width="1.5"/>
  <circle cx="355" cy="491" r="10" fill="#0e1a2c" stroke="#476a99" stroke-width="1.5"/>
  <circle cx="355" cy="491" r="3" fill="#5c80ad"/>
  <rect x="412" y="474" width="116" height="34" rx="3" fill="#2b3a55" stroke="#5c80ad" stroke-width="1.5"/>
  <text x="470" y="495" text-anchor="middle" font-family="Arial" font-size="10" fill="#a9c4e6">SATA</text>

  <!-- POWER SUPPLY -->
  <g>
    <rect x="290" y="524" width="248" height="30" rx="4" fill="url(#psu)" stroke="#fcd34d" stroke-width="2"/>
    <circle cx="330" cy="539" r="12" fill="#3b2a0c" stroke="#fcd34d" stroke-width="1.5"/>
    <g stroke="#fcd34d" stroke-width="1.2">
      <path d="M330 528v22M319 539h22M322 531l16 16M338 531l-16 16"/>
    </g>
    <text x="410" y="544" text-anchor="middle" font-family="Arial" font-size="10" fill="#3b2a0c" font-weight="bold">POWER SUPPLY</text>
  </g>

  <!-- CASE FAN -->
  <g>
    <rect x="500" y="176" width="46" height="46" rx="4" fill="#10233d" stroke="#3d5a80" stroke-width="2"/>
    <circle cx="523" cy="199" r="18" fill="#0c1830" stroke="#4da3ff" stroke-width="1.5"/>
    <g fill="#4f7fb5" opacity="0.85">
      <ellipse cx="523" cy="187" rx="4" ry="10"/>
      <ellipse cx="523" cy="211" rx="4" ry="10"/>
      <ellipse cx="511" cy="199" rx="10" ry="4"/>
      <ellipse cx="535" cy="199" rx="10" ry="4"/>
    </g>
    <circle cx="523" cy="199" r="4" fill="#9fd1ff"/>
  </g>

  <!-- ================= LABELS ================= -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff">
    <!-- left: motherboard -->
    <line x1="272" y1="230" x2="150" y2="250" stroke="#4da3ff" stroke-width="1.5"/>
    <circle cx="272" cy="230" r="3.5" fill="#4da3ff"/>
    <text x="30" y="248">Motherboard</text>
    <text x="30" y="266" font-size="11" fill="#9fb3d6">main circuit board</text>

    <!-- left: power supply -->
    <line x1="290" y1="539" x2="150" y2="560" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="290" cy="539" r="3.5" fill="#fcd34d"/>
    <text x="30" y="558">Power Supply</text>
    <text x="30" y="576" font-size="11" fill="#9fb3d6">converts AC to DC power</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffffff">
    <!-- right: CPU -->
    <line x1="398" y1="142" x2="640" y2="92" stroke="#4da3ff" stroke-width="1.5"/>
    <circle cx="398" cy="142" r="3.5" fill="#4da3ff"/>
    <text x="648" y="90">CPU (Processor)</text>
    <text x="648" y="108" font-size="11" fill="#9fb3d6">with CPU cooler / fan</text>

    <!-- right: RAM -->
    <line x1="496" y1="150" x2="640" y2="170" stroke="#4da3ff" stroke-width="1.5"/>
    <circle cx="496" cy="150" r="3.5" fill="#4da3ff"/>
    <text x="648" y="168">RAM (Memory)</text>
    <text x="648" y="186" font-size="11" fill="#9fb3d6">temporary working memory</text>

    <!-- right: GPU -->
    <line x1="538" y1="359" x2="640" y2="300" stroke="#4da3ff" stroke-width="1.5"/>
    <circle cx="538" cy="359" r="3.5" fill="#4da3ff"/>
    <text x="648" y="298">Graphics Card (GPU)</text>
    <text x="648" y="316" font-size="11" fill="#9fb3d6">renders images and video</text>

    <!-- right: storage -->
    <line x1="538" y1="470" x2="640" y2="430" stroke="#4da3ff" stroke-width="1.5"/>
    <circle cx="538" cy="470" r="3.5" fill="#4da3ff"/>
    <text x="648" y="428">Storage (SSD / HDD)</text>
    <text x="648" y="446" font-size="11" fill="#9fb3d6">keeps files permanently</text>

    <!-- right: case fan -->
    <line x1="546" y1="199" x2="640" y2="520" stroke="#4da3ff" stroke-width="1.5" opacity="0.75"/>
    <circle cx="546" cy="199" r="3.5" fill="#4da3ff"/>
    <text x="648" y="518">Case Fan</text>
    <text x="648" y="536" font-size="11" fill="#9fb3d6">keeps airflow cool</text>
  </g>

  <!-- caption -->
  <text x="500" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9fb3d6">Figure 1: Key components inside a desktop computer case</text>
</svg>
