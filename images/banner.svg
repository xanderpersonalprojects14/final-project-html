<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Banner illustration of a laptop with code on screen, representing a computing journey">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11213d"/>
      <stop offset="100%" stop-color="#1d3a6e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" fill="url(#bg)"/>
  <!-- stars -->
  <circle cx="60" cy="40" r="2" fill="#4da3ff"/>
  <circle cx="820" cy="60" r="2" fill="#4da3ff"/>
  <circle cx="760" cy="200" r="2" fill="#4da3ff"/>
  <circle cx="120" cy="210" r="2" fill="#4da3ff"/>
  <circle cx="400" cy="30" r="2" fill="#4da3ff"/>
  <!-- laptop body -->
  <rect x="300" y="110" width="300" height="180" rx="10" fill="#081222" stroke="#2563eb" stroke-width="3"/>
  <rect x="318" y="128" width="264" height="140" rx="4" fill="#0a1930"/>
  <!-- code lines on screen -->
  <rect x="334" y="144" width="80" height="8" rx="2" fill="#4da3ff"/>
  <rect x="334" y="162" width="140" height="8" rx="2" fill="#8db4f7"/>
  <rect x="350" y="180" width="110" height="8" rx="2" fill="#4da3ff"/>
  <rect x="334" y="198" width="160" height="8" rx="2" fill="#2563eb"/>
  <rect x="350" y="216" width="90" height="8" rx="2" fill="#8db4f7"/>
  <rect x="334" y="234" width="60" height="8" rx="2" fill="#4da3ff"/>
  <!-- laptop base -->
  <polygon points="270,290 630,290 610,310 290,310" fill="#11213d" stroke="#2563eb" stroke-width="2"/>
  <!-- angle brackets floating -->
  <text x="150" y="150" font-family="Arial" font-size="60" fill="#2563eb" opacity="0.5">&lt;/&gt;</text>
  <text x="640" y="170" font-family="Arial" font-size="40" fill="#4da3ff" opacity="0.6">{ }</text>
</svg>
